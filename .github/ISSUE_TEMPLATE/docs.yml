name: Documentation
description: Something in the docs is missing, wrong or unclear
title: "docs: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Where
      description: File path or page URL.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
